<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Water wave base -->
  <circle cx="24" cy="24" r="22" fill="#0B7B8C" opacity="0.15"/>
  <!-- Fish body -->
  <ellipse cx="22" cy="24" rx="11" ry="7" fill="#0B7B8C"/>
  <!-- Fish tail -->
  <path d="M33 24 L40 18 L40 30 Z" fill="#0B7B8C"/>
  <!-- Fish eye -->
  <circle cx="14" cy="22" r="2.2" fill="white"/>
  <circle cx="14.5" cy="22" r="1" fill="#0B7B8C"/>
  <!-- Fish stripe -->
  <path d="M20 17.5 Q22 24 20 30.5" stroke="white" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Bubble 1 -->
  <circle cx="10" cy="14" r="2" stroke="#A7E3E9" stroke-width="1.5" fill="none"/>
  <!-- Bubble 2 -->
  <circle cx="15" cy="9" r="1.3" stroke="#A7E3E9" stroke-width="1.2" fill="none"/>
  <!-- Bubble 3 -->
  <circle cx="7" cy="8" r="1" stroke="#A7E3E9" stroke-width="1" fill="none"/>
</svg>
