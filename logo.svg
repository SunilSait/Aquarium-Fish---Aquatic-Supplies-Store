<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="bgGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E333D"/>
      <stop offset="100%" stop-color="#071A20"/>
    </linearGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="ringGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#0B7B8C"/>
      <stop offset="100%" stop-color="#FF7B54"/>
    </linearGradient>

    <!-- Fish Body Gradient -->
    <linearGradient id="fishGrad" x1="16" y1="20" x2="48" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="35%" stop-color="#0B7B8C"/>
      <stop offset="75%" stop-color="#065864"/>
      <stop offset="100%" stop-color="#FF7B54"/>
    </linearGradient>

    <!-- Fin Accent Gradient -->
    <linearGradient id="finGrad" x1="36" y1="18" x2="52" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E7D"/>
      <stop offset="100%" stop-color="#FF6B4A"/>
    </linearGradient>

    <!-- Specular Highlight Gradient -->
    <linearGradient id="shineGrad" x1="18" y1="14" x2="34" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Filter for soft drop shadow & glow -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Circular Badge -->
  <circle cx="32" cy="32" r="28" fill="url(#bgGrad)"/>
  
  <!-- Outer Orbit Ring -->
  <circle cx="32" cy="32" r="28" stroke="url(#ringGrad)" stroke-width="2" opacity="0.85"/>
  
  <!-- Water Wave Arc Overlay -->
  <path d="M8 32 C 16 22, 28 40, 44 26 C 50 21, 54 28, 56 32" stroke="#00E5FF" stroke-width="1.2" stroke-linecap="round" opacity="0.25" fill="none"/>

  <!-- Fish Group with Glow -->
  <g filter="url(#logoGlow)">
    <!-- Dorsal Fin (Top) -->
    <path d="M26 21 C 32 14, 40 16, 43 23 C 37 23, 31 23, 26 21 Z" fill="url(#finGrad)" opacity="0.9"/>

    <!-- Ventral / Pectoral Fin (Bottom) -->
    <path d="M27 41 C 32 47, 39 46, 41 40 C 36 39, 31 39, 27 41 Z" fill="url(#finGrad)" opacity="0.8"/>

    <!-- Tail Fin (Flukes) -->
    <path d="M40 32 C 46 25, 52 19, 54 22 C 51 28, 48 31, 51 32 C 48 33, 51 36, 54 42 C 52 45, 46 39, 40 32 Z" fill="url(#finGrad)"/>

    <!-- Fish Main Body -->
    <path d="M14 32 C 18 22, 34 20, 43 32 C 34 44, 18 42, 14 32 Z" fill="url(#fishGrad)"/>

    <!-- Curved Decorative Body Stripe 1 -->
    <path d="M25 22.5 C 29 27, 29 37, 25 41.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8" fill="none"/>

    <!-- Curved Decorative Body Stripe 2 -->
    <path d="M34 24.5 C 37 28, 37 36, 34 39.5" stroke="#A7E3E9" stroke-width="1.4" stroke-linecap="round" opacity="0.6" fill="none"/>

    <!-- Eye Outer Glow -->
    <circle cx="20" cy="30" r="3.2" fill="#FFFFFF"/>
    
    <!-- Eye Pupil -->
    <circle cx="19.2" cy="29.8" r="1.8" fill="#071A20"/>

    <!-- Eye Catchlight Sparkle -->
    <circle cx="18.6" cy="29.2" r="0.65" fill="#FFFFFF"/>

    <!-- Fish Body Gloss Highlight -->
    <path d="M17 30 C 20 24, 30 22, 36 26 C 29 24, 21 26, 17 30 Z" fill="url(#shineGrad)"/>
  </g>

  <!-- Glowing Water Bubbles -->
  <circle cx="12" cy="18" r="2.5" fill="#00E5FF" opacity="0.75"/>
  <circle cx="11.2" cy="17.2" r="0.8" fill="#FFFFFF" opacity="0.9"/>

  <circle cx="17" cy="11" r="1.6" fill="#A7E3E9" opacity="0.65"/>
  <circle cx="16.5" cy="10.5" r="0.5" fill="#FFFFFF" opacity="0.85"/>

  <circle cx="7" cy="26" r="1.2" fill="#00E5FF" opacity="0.5"/>
</svg>
