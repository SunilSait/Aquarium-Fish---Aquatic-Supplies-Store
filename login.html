<!DOCTYPE html>
<html lang="en" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your AquaWorld account to manage orders, track rare fish arrivals, and access exclusive member offers.">
    <title>Login | AquaWorld Aquarium Store</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <style>
        body.auth-page {
            background: linear-gradient(160deg, #071A20 0%, #0A2C38 50%, #071A20 100%);
            min-height: 100vh;
        }

        /* Subtle animated background */
        body.auth-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 30%, rgba(11,123,140,0.18) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, rgba(167,227,233,0.06) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-topbar {
            display: flex;
            justify-content: flex-end;
            padding: 1.25rem 1.5rem;
            max-width: 1240px;
            margin: 0 auto;
            width: 100%;
            gap: 0.5rem;
            position: relative;
            z-index: 1;
        }

        .auth-toggle-btn {
            width: 36px; height: 36px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: var(--radius-sm);
            color: rgba(255,255,255,0.7);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-family: var(--font-sans);
            transition: all 0.2s;
        }

        .auth-toggle-btn:hover {
            background: rgba(255,255,255,0.14);
            border-color: var(--clr-secondary);
            color: var(--clr-secondary);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }

        .auth-card {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: var(--radius-xl);
            padding: 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.50);
            position: relative;
            overflow: hidden;
        }

        html:not(.dark) .auth-card {
            background: var(--bg-surface);
            border-color: var(--border-color);
        }

        /* Subtle glow orb */
        .auth-card::before {
            content: '';
            position: absolute;
            top: -80px; right: -80px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(11,123,140,0.20) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            text-decoration: none;
            margin-bottom: 2rem;
        }

        .auth-logo .brand-top { color: var(--clr-primary); font-size: 1rem; font-weight: 800; letter-spacing: 0.05em; }
        .auth-logo .brand-bottom { font-size: 0.7rem; color: var(--text-muted); }

        html.dark .auth-logo .brand-top { color: var(--clr-secondary); }

        .auth-heading {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .auth-heading h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-heading);
            margin-bottom: 0.375rem;
        }

        html.dark .auth-heading h1 { color: #E8F8FA; }

        .auth-heading p {
            font-size: 0.875rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        html.dark .auth-heading p { color: rgba(255,255,255,0.5); }

        .social-login-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.625rem;
            margin-bottom: 1.5rem;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem;
            background: var(--bg-surface-2);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font-sans);
        }

        html.dark .social-btn {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.10);
        }

        .social-btn:hover {
            border-color: var(--clr-primary);
            transform: translateY(-2px);
        }

        html.dark .social-btn:hover { border-color: var(--clr-secondary); }

        .divider {
            text-align: center;
            position: relative;
            color: var(--text-muted);
            font-size: 0.8125rem;
            margin: 1.25rem 0;
        }

        html.dark .divider { color: rgba(255,255,255,0.35); }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            height: 1px;
            background: var(--border-color);
            width: calc(50% - 70px);
        }
        html.dark .divider::before, html.dark .divider::after { background: rgba(255,255,255,0.10); }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .form-label { color: var(--text-heading); }
        html.dark .form-label { color: rgba(255,255,255,0.80); }

        .form-input {
            background: var(--bg-surface);
            border-color: var(--border-color);
            color: var(--text-heading);
        }

        html.dark .form-input {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.10);
            color: #E8F8FA;
        }

        html.dark .form-input::placeholder { color: rgba(255,255,255,0.30); }
        html.dark .form-input:focus { border-color: var(--clr-secondary); }

        .link-primary { color: var(--clr-primary); }
        html.dark .link-primary { color: var(--clr-secondary); }

        .checkbox-wrapper label { color: var(--text-muted); }
        html.dark .checkbox-wrapper label { color: rgba(255,255,255,0.50); }
    </style>
</head>
<body class="auth-page">

<!-- Bubble decorations -->
<div class="bubble-wrap" aria-hidden="true" style="position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;">
    <div class="bubble" style="width:80px;height:80px;left:5%;bottom:-50px;animation-duration:14s;"></div>
    <div class="bubble" style="width:40px;height:40px;left:20%;bottom:-30px;animation-duration:10s;animation-delay:2s;"></div>
    <div class="bubble" style="width:60px;height:60px;left:80%;bottom:-40px;animation-duration:12s;animation-delay:4s;"></div>
    <div class="bubble" style="width:30px;height:30px;left:65%;bottom:-25px;animation-duration:9s;animation-delay:1s;"></div>
</div>

<!-- Top Bar -->
<div class="auth-topbar">
    <button onclick="toggleDir()" class="auth-toggle-btn" title="Toggle Direction" aria-label="Toggle text direction">
        <span class="dir-label" style="font-size:0.6rem;font-weight:700;">LTR</span>
    </button>
    <button onclick="toggleTheme()" class="auth-toggle-btn" title="Toggle Theme" aria-label="Toggle dark mode">
        <span class="theme-icon-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </span>
    </button>
</div>

<main>
    <div class="auth-card">

        <!-- Logo -->
        <a href="index.html" class="auth-logo" aria-label="AquaWorld Home">
            <img src="logo.svg" alt="AquaWorld Logo" width="48" height="48" style="width:48px;height:48px;object-fit:contain;display:block;">
            <div class="auth-logo-text">
                <span class="brand-top">AQUA</span>
                <span class="brand-bottom">WORLD</span>
            </div>
        </a>

        <!-- Heading -->
        <div class="auth-heading">
            <h1>Welcome Back</h1>
            <p>Sign in to your AquaWorld account</p>
        </div>

        <!-- Social Login -->
        <div class="social-login-grid">
            <button class="social-btn" title="Sign in with Google" aria-label="Sign in with Google">
                <svg width="20" height="20" viewBox="0 0 24 24">
                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                </svg>
            </button>
            <button class="social-btn" title="Sign in with Apple" aria-label="Sign in with Apple">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color:var(--text-heading);">
                    <path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/>
                </svg>
            </button>
            <button class="social-btn" title="Sign in with Facebook" aria-label="Sign in with Facebook">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                </svg>
            </button>
        </div>

        <div class="divider">or continue with email</div>

        <!-- Form -->
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="login-email">Email Address</label>
                <input type="email" id="login-email" class="form-input" placeholder="your@email.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('login-password', this)" aria-label="Toggle password visibility">
                        <span class="pw-icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </span>
                    </button>
                </div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.5rem;">
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Remember Me</label>
                </div>
                <a href="#" class="link-primary" style="font-size:0.875rem;font-weight:600;">Forgot Password?</a>
            </div>

            <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">Sign In</button>
        </form>

        <p style="text-align:center;margin-top:1.75rem;font-size:0.875rem;color:var(--text-muted);">
            Don't have an account? <a href="signup.html" class="link-primary">Create Account</a>
        </p>

    </div>
</main>

<script src="components.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', initAuthPage);

    function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        btn.textContent = 'Signing in…';
        btn.disabled = true;
        setTimeout(() => {
            alert('Login successful! Welcome back to AquaWorld 🐠');
            window.location.href = 'index.html';
        }, 1000);
    }
</script>
</body>
</html>
